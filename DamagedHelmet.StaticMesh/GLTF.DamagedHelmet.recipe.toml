# glTF Sample Models: DamagedHelmet (Material_MR, single material).
# ORM is repacked offline from Default_AO.jpg (R) + Default_metalRoughness.jpg (G,B)
# into DamagedHelmet.ORM.Tex2D; emissive texture is the only emissive source
# (PBRSurface rows carry no emissive factor).
schema = 1
name = "GLTF.DamagedHelmet"
domain = "StandardOpaque"

[[textures]]
name = "base_color"
asset = "DamagedHelmet.image.0.Tex2D"
auto_mipmaps = true

[[textures]]
name = "normal"
asset = "DamagedHelmet.image.4.Normal.Tex2D"
auto_mipmaps = true

[[textures]]
name = "orm"
asset = "DamagedHelmet.ORM.Tex2D"
auto_mipmaps = true

[[textures]]
name = "emissive"
asset = "DamagedHelmet.image.2.Emissive.Tex2D"
auto_mipmaps = true
